title: Il Mio Sito di Videogiochi
description: Notizie, recensioni e guide dal mondo dei videogiochi
remote_theme: "mmistakes/minimal-mistakes"

# Permalink senza date
permalink: /:collection/:title/

include:
  - assets

# Collections personalizzate
collections:
  news:
    output: true
    permalink: /news/:title/
  recensioni:
    output: true
    permalink: /recensioni/:title/
  guide:
    output: true
    permalink: /guide/:title/

# Impostazioni autore
author:
  name: "Il Mio Nome"
  bio: "Appassionato di videogiochi, scrivo notizie, recensioni e guide."
  location: "Italia"

# Navigazione (menu in alto)
navigation:
  - title: "Home"
    url: /
  - title: "News"
    url: /news/
  - title: "Recensioni"
    url: /recensioni/
  - title: "Guide"
    url: /guide/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

paginate: 5           # quanti articoli mostrare per pagina
paginate_path: "/page:num/"